# Water Distribution Network Leak Detection System Configuration

# Data path configuration
data:
  epanet_file: "data/Exa7.inp"     # EPANET network file path
  output_dir: "output/"            # Output directory
  log_dir: "logs/"                 # Log directory

# Hydraulic simulation configuration
hydraulic:
  simulation_hours: 24             # Simulation duration (hours)
  time_step: 1                     # Time step (hours)
  demand_reduction_ratio: 0.03      # Anomalous demand ratio (20%)
  
# FCM partitioning configuration (used for partitioning during training)
fcm:
  n_clusters: 4                    # Number of partitions
  max_iter: 100                    # Maximum iterations
  error: 1e-5                      # Convergence error
  m: 1.5                           # Fuzziness exponent
  k_nearest: 10                    # KNN parameter (for outlier detection)
  outliers_detection: false         # Whether to perform outlier detection
  seed: 42                         # Random seed

# Graph2Vec configuration
graph2vec:
  dimensions: 128                  # Embedding dimensions
  workers: 4                       # Number of parallel workers
  epochs: 10                       # Training epochs
  min_count: 5                     # Minimum word frequency
  learning_rate: 0.025             # Learning rate

# LTFM model configuration
ltfm:
  embedding_dim: 64                # Embedding dimension (further reduced)
  hidden_dim: 128                  # Hidden layer dimension (further reduced)
  num_heads: 4                     # Number of attention heads (halved)
  num_layers: 2                    # Number of layers (halved)
  dropout: 0.3                     # Dropout rate (increased regularization)

# NodeLocalizer configuration (node-level leak localization)
node_localizer:
  hidden_dim: 128                  # Hidden layer dimension (reduced to prevent overfitting)
  dropout: 0.5                     # Dropout rate (increased to prevent overfitting)
  epochs: 100                      # Training epochs
  learning_rate: 0.0001            # Learning rate (lowered for fine-tuning physics bias)
  
# Training configuration
training:
  batch_size: 128                   # Batch size (leveraging GPU parallelism)
  learning_rate: 0.001             # Learning rate
  epochs: 50                       # Training epochs
  weight_decay: 0.001              # Weight decay
  early_stopping_patience: 20      # Early stopping patience

# Inference configuration
inference:
  threshold: 0.5                   # Anomaly detection threshold
  confidence_threshold: 0.8        # Confidence threshold

# Device configuration
device:
  use_cuda: true                   # Whether to use CUDA
  gpu_id: 0                        # GPU ID

# Logging configuration
logging:
  level: "INFO"                    # Log level
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {message}"
